# ================
# === Hyprlock ===
# ================

general {
    hide_cursor = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    path = /home/jwd/Pictures/wallpapers/166.jpg

    blur_size = 0
    blur_passes = 3
    brightness = 0.3000
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%I") </big></b>"
    color = rgba(255, 255, 255, 1)
    font_size = 112
    font_family = Open Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(255, 255, 255, 1)
    font_size = 112
    font_family = Open Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 80
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgba(255, 255, 255, 1)
    font_size = 18
    font_family = Open Sans

    position = 0, -15
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = rgba(255, 255, 255, 1)
    font_size = 14
    font_family = Open Sans 10

    position = 0, -40
    halign = center
    valign = center
}

