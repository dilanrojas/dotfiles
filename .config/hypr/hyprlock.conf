$font = Adwaita Sans

general {
    hide_cursor = true
}

animations {
    enabled = false
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.1
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    # Neutral Monochrome Palette
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(255, 255, 255, 0.6)
    
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = <span foreground="##ffffff80">Password...</span>
    fail_text = <i>$PAMFAIL</i>

    position = 0, -50
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = $font

    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = $font

    position = 0, 80
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 12
    font_family = $font

    position = 0, 30
    halign = center
    valign = bottom
}
