# =================
# === AUTOSTART ===
# =================
exec-once = waybar &
exec-once = hyprpaper &
exec-once = xdg-desktop-portal-hyprland &
exec-once = swaync &
exec-once = mpris-proxy &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP /usr/lib/xdg-desktop-portal-gnome
exec-once = hypridle &
exec-once = hyprsunset &
exec-once = bash ~/.config/hypr/scripts/low_battery.sh &
exec-once = swayosd-server &
