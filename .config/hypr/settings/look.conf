# ============
# === LOOK ===
# ============

source = ../themes/solarized-osaka/hyprland.conf

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = $activeBorder
    col.inactive_border = $inactiveBorder
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 30
        render_power = 20
        ignore_window = true
        color = rgba(09090940)
        offset = 0, 0
    }

    blur {
        enabled = true
        size = 1
        passes = 2
        vibrancy = 0
        popups = false
        special = false
        ignore_opacity = true
        new_optimizations = true
        xray = true
    }
}

$fadeInterval = 1
$slideInterval = 3.5
$windowsInterval = 2.8

animations {
    enabled = yes

    bezier = quick,          0.15, 0,    0.1,  1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1

    animation = windows, 1, $windowsInterval, easeOutQuint, popin 90%
    animation = fade, 1, 1.8, quick
    animation = layers, 1, $fadeInterval, linear, fade
    animation = border, 1, $fadeInterval, linear
    animation = workspaces, 1, $slideInterval, easeOutQuint, slide
    animation = specialWorkspace, 0, $fadeInterval, linear, fade
  }

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    font_family = "Adwaita Sans"
    disable_autoreload = false
}

ecosystem {
    no_update_news = true
}
