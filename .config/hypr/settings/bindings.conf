###################
### KEYBINDINGS ###
###################
$float = --class float

$terminal = alacritty
$browser = brave
$fileManager = nautilus
$menu = rofi -show drun
$screenshot = bash ~/.config/hypr/scripts/screenshot.sh
$cropscreenshot = bash ~/.config/hypr/scripts/cropscreenshot.sh
$clipboard = $uwsm cliphist list | rofi -dmenu | cliphist decode | wl-copy
$eyeDropper = $uwsm hyprpicker -a -f hex
$reload = bash ~/.config/hypr/scripts/reload.sh
$theme_changer = bash ~/.config/hypr/scripts/themes_rofi_list.sh
$bluetoothui = $terminal $float -e bluetui
$colorPicker = $uwsm kcolorchooser

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, exec, $menu
bind = $mainMod, Y, pseudo,
bind = $mainMod, I, layoutmsg, togglesplit
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, R, exec, $reload
bind = $mainMod, T, exec, $theme_changer
bind = $mainMod SHIFT, Q, exec, wlogout
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, W, exec, hyprlock
bind = $mainMod, D, exec, $colorPicker
bind = $mainMod, P, exec, $eyeDropper
bind = $mainMod SHIFT, B, exec, $bluetoothui
bind = $mainMod, V, exec, $clipboard

bind = $mainMod, PRINT, exec, $screenshot
bind = $mainMod SHIFT, S, exec, $cropscreenshot
bind = $mainMod, S, exec, $screenshot
bind = , PRINT, exec, $cropscreenshot

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod CONTROL, l, resizeactive, 50 0
bind = $mainMod CONTROL, h, resizeactive, -50 0
bind = $mainMod CONTROL, k, resizeactive, 0 -50
bind = $mainMod CONTROL, j, resizeactive, 0 50

bind = $mainMod, U, togglespecialworkspace, magic
bind = $mainMod SHIFT, U, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
$osd = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

bindel = ,XF86AudioRaiseVolume, exec, $osd --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, $osd --output-volume lower
bindel = ,XF86AudioMute, exec, $osd --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, $osd --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, $osd --brightness raise
bindel = ,XF86MonBrightnessDown, exec, $osd --brightness lower

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
